name: Manuals

on:
  push:
    branches: [main]
    paths:
      - 'docs/manuales/**'
      # validar.py checks the manuals' version against gradle.properties
      - gradle.properties
      - '.github/actions/manuales/**'
      - .github/workflows/manuales.yml
  pull_request:
    paths:
      - 'docs/manuales/**'
      - gradle.properties
      - '.github/actions/manuales/**'
      - .github/workflows/manuales.yml
  # republishes the site from main without a change
  workflow_dispatch:

# a pr run gives way to a newer push; on main a pages deployment is never cut halfway
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Manuals (HTML + PDF)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/manuales
      - name: Upload the manuals
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuales
          path: docs/manuales/salida/
          if-no-files-found: error
      # the whole salida/: the library page links the pdfs as ../pdf/
      - name: Upload the pages site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/manuales/salida/

  pages:
    name: GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # needs settings > pages > source: github actions
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
