name: Release

on:
  release:
    types: [published]

# packages: the wasichai libraries come from github packages (settings.gradle.kts reads GITHUB_ACTOR / GITHUB_TOKEN)
# contents: write: attaches the jar, the manuals and the presentations to the release
permissions:
  contents: write
  packages: read

jobs:
  jar:
    name: Boot jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # unit tests and ktlint run in ci.yml on the merge commit; the release builds the jar from the tag
      - name: Build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew bootJar --no-daemon -Pversion="${GITHUB_REF_NAME#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar="srtm-backend-${GITHUB_REF_NAME#v}.jar"
          cp build/libs/app.jar "$jar"
          sha256sum "$jar" > "$jar.sha256"
          gh release upload "$GITHUB_REF_NAME" "$jar" "$jar.sha256" --clobber

  manuals:
    name: Manuals (PDF + HTML)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # release-please bumps docs/manuales/atributos.adoc with gradle.properties, so validar.py passes on the tag
      - uses: ./.github/actions/manuales
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: docs/manuales/salida
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir adjuntos
          for pdf in pdf/*/*.pdf; do
            nombre="$(basename "$pdf" .pdf)"
            cp "$pdf" "adjuntos/srtm-manual-${nombre#manual-}-$version.pdf"
          done
          zip -qr "adjuntos/srtm-manuales-$version-html.zip" index.html html pdf
          (cd adjuntos && sha256sum -- * > "srtm-manuales-$version.sha256")
          gh release upload "$GITHUB_REF_NAME" adjuntos/* --clobber

  # the list of videos for the matrix (one job per video: all of them in one job would take hours)
  presentations-list:
    name: Presentations (list)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      videos: ${{ steps.list.outputs.videos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - id: list
        working-directory: docs/presentaciones
        run: node --input-type=module -e "const { VIDEOS } = await import('./src/videos/index.ts'); console.log('videos=' + JSON.stringify(VIDEOS.map((v) => v.numero)))" >> "$GITHUB_OUTPUT"

  presentations:
    name: Presentation ${{ matrix.video }}
    needs: presentations-list
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        video: ${{ fromJSON(needs.presentations-list.outputs.videos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/presentaciones
        with:
          videos: ${{ matrix.video }}
      # srtm-03-registro-tributario.mp4 → srtm-presentacion-03-registro-tributario-<version>.mp4, with its sha256
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: docs/presentaciones/salida/videos
        run: |
          version="${GITHUB_REF_NAME#v}"
          for mp4 in srtm-*.mp4; do
            nombre="$(basename "$mp4" .mp4)"
            adjunto="srtm-presentacion-${nombre#srtm-}-$version.mp4"
            mv "$mp4" "$adjunto"
            sha256sum "$adjunto" > "$adjunto.sha256"
            gh release upload "$GITHUB_REF_NAME" "$adjunto" "$adjunto.sha256" --clobber
          done
