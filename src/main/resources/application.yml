server:
  # model/apply.py and model/import_predios.py default to http://localhost:8090
  port: 8090

spring:
  application:
    name: srtm-backend

wasichai:
  database:
    host: ${WASICHAI_DB_HOST:localhost}
    # compose.yml publishes postgis on 5433. never 5432: another app's postgres may live there
    port: ${WASICHAI_DB_PORT:5433}
    name: ${WASICHAI_DB_NAME:srtm}
    username: ${WASICHAI_DB_USERNAME:srtm}
    password: ${WASICHAI_DB_PASSWORD:srtm}
  seed:
    # admin@wasichai.local / admin. development only: turn off anywhere real
    dev: ${WASICHAI_SEED_DEV:true}
  security:
    jwt:
      # development only. a real deployment sets WASICHAI_JWT_SECRET (>= 32 bytes)
      secret: ${WASICHAI_JWT_SECRET:srtm-dev-only-secret-change-me-0123456789}
  gis:
    geoserver:
      # without GeoServer the lotes are served straight from PostGIS; only publishing WMS layers needs it
      enabled: ${WASICHAI_GEOSERVER_ENABLED:false}
      url: ${WASICHAI_GEOSERVER_URL:http://localhost:8081/geoserver}

logging:
  level:
    # openhtmltopdf logs every render (fonts loaded, stylesheets parsed) at INFO
    com.openhtmltopdf: WARN

srtm:
  municipalidad:
    # the header of the emitted documents (PU, HR)
    nombre: ${SRTM_MUNICIPALIDAD_NOMBRE:MUNICIPALIDAD DISTRITAL DE PERENÉ}
  pide:
    reniec:
      # the DNI's names from RENIEC through the PIDE (pages 3, 8 and 15). off until the municipality's convenio gives
      # a user (a DNI), its RUC and a password: set them in the environment, never here. off, the names are typed
      enabled: ${SRTM_PIDE_RENIEC_ENABLED:false}
      url: ${SRTM_PIDE_RENIEC_URL:https://ws2.pide.gob.pe/Rest/RENIEC/Consultar}
      dni-usuario: ${SRTM_PIDE_RENIEC_DNI_USUARIO:}
      ruc-usuario: ${SRTM_PIDE_RENIEC_RUC_USUARIO:}
      password: ${SRTM_PIDE_RENIEC_PASSWORD:}
      # the clerk waits on it leaving the DNI
      timeout: ${SRTM_PIDE_RENIEC_TIMEOUT:5s}
      # how long a consulta backs a save with fuente PIDE RENIEC
      vigencia: 30m
  emision:
    # the emisiones masivas' files (emision-<anio>-<id>.pdf|zip). a real deployment points it at a persistent volume
    dir: ${SRTM_EMISION_DIR:./data/emisiones}
