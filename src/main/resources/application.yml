server:
  # model/apply.py and model/import_predios.py default to http://localhost:8090
  port: 8090

spring:
  application:
    name: srtm-backend

wasichai:
  database:
    host: ${WASICHAI_DB_HOST:localhost}
    # compose.yml publishes postgis on 5433. never 5432: another app's postgres may live there
    port: ${WASICHAI_DB_PORT:5433}
    name: ${WASICHAI_DB_NAME:srtm}
    username: ${WASICHAI_DB_USERNAME:srtm}
    password: ${WASICHAI_DB_PASSWORD:srtm}
  seed:
    # admin@wasichai.local / admin. development only: turn off anywhere real
    dev: ${WASICHAI_SEED_DEV:true}
  security:
    jwt:
      # development only. a real deployment sets WASICHAI_JWT_SECRET (>= 32 bytes)
      secret: ${WASICHAI_JWT_SECRET:srtm-dev-only-secret-change-me-0123456789}
  gis:
    geoserver:
      # without GeoServer the lotes are served straight from PostGIS; only publishing WMS layers needs it
      enabled: ${WASICHAI_GEOSERVER_ENABLED:false}
      url: ${WASICHAI_GEOSERVER_URL:http://localhost:8081/geoserver}
  files:
    # wasichai-files: the FILE and IMAGE fields (the municipalidad's escudo). the rows in its table stored_files (created
    # at startup), the bytes here with srtm.archivos.almacen=local. a real deployment points it at a persistent volume,
    # the same for every instance. srtm.archivos.almacen=s3 keeps them in a bucket instead (never wasichai.files.store=s3)
    local:
      path: ${SRTM_ARCHIVOS_DIR:./data/archivos}

logging:
  level:
    # openhtmltopdf logs every render (fonts loaded, stylesheets parsed) at INFO
    com.openhtmltopdf: WARN

srtm:
  municipalidad:
    # the header of the emitted documents (PU, HR) is the organization's municipalidad record, edited in the admin
    # (nombre, oficina, ruc, gerencia, direccion). this name is only its fallback, while there is no record. empty (the
    # default), the fallback is the organization's own name in core: an install with several municipalidades never
    # prints another's
    nombre: ${SRTM_MUNICIPALIDAD_NOMBRE:}
    # the escudo is the record's (its IMAGE field, uploaded in the admin). this one, a png or jpg (classpath:… or
    # file:…), is only the fallback of an organization whose record has none. empty prints none
    escudo: ${SRTM_MUNICIPALIDAD_ESCUDO:}
    # how long the header is kept per organization: an edit in the admin shows within it
    cache: 1m
  archivos:
    # where wasichai-files keeps the bytes of the FILE and IMAGE fields (ArchivosS3): local, on this server's disk under
    # wasichai.files.local.path, or s3, in the bucket of s3.* (no shared volume: what k8s wants). the credentials as
    # srtm.emision.s3's: the aws sdk's default chain
    almacen: ${SRTM_ARCHIVOS_ALMACEN:local}
    s3:
      bucket: ${SRTM_ARCHIVOS_S3_BUCKET:}
      region: ${SRTM_ARCHIVOS_S3_REGION:}
      endpoint: ${SRTM_ARCHIVOS_S3_ENDPOINT:}
      # the keys go under it: <prefijo>/<organization id>/<file id>; none: the bucket's root
      prefijo: ${SRTM_ARCHIVOS_S3_PREFIJO:}
  pide:
    reniec:
      # the DNI's names from RENIEC through the PIDE (pages 3, 8 and 15). off until the municipality's convenio gives
      # a user (a DNI), its RUC and a password: set them in the environment, never here. off, the names are typed
      enabled: ${SRTM_PIDE_RENIEC_ENABLED:false}
      url: ${SRTM_PIDE_RENIEC_URL:https://ws2.pide.gob.pe/Rest/RENIEC/Consultar}
      dni-usuario: ${SRTM_PIDE_RENIEC_DNI_USUARIO:}
      ruc-usuario: ${SRTM_PIDE_RENIEC_RUC_USUARIO:}
      password: ${SRTM_PIDE_RENIEC_PASSWORD:}
      # the clerk waits on it leaving the DNI
      timeout: ${SRTM_PIDE_RENIEC_TIMEOUT:5s}
      # how long a consulta backs a save with fuente PIDE RENIEC
      vigencia: 30m
  catastro:
    # catastro-backend's valuations for the brecha de recaudación, a catastro per organization of srtm, each read as
    # its service account srtm (role SRTM_LECTOR, created by that catastro's model/crear_cuenta_srtm.py). off until the
    # urls and the accounts are set in the environment, never here. off, no corrida starts (409)
    enabled: ${SRTM_CATASTRO_ENABLED:false}
    # organizaciones.<slug-or-id>: url, client-id, client-secret and, optional, timeout (else the one below). no entry
    # is declared here: the environment adds them by relaxed binding, SRTM_CATASTRO_ORGANIZACIONES_<KEY>_URL,
    # _CLIENT_ID, _CLIENT_SECRET, _TIMEOUT. the key arrives lowercase and can carry no dash nor underscore, so an id
    # (or a slug with either) goes in the entry's organizacion, under any key:
    # SRTM_CATASTRO_ORGANIZACIONES_ICA_ORGANIZACION=<id>. an organization without an entry gets 409
    # SIN_CATASTRO_CONFIGURADO; one named by two entries, 409 too (neither is read)
    # the single url, client-id, client-secret and organizacion below are one more entry (an entry of the map naming
    # the same organization the same way, both by slug or both by id, replaces it): the one-catastro install of before
    # keeps working
    url: ${SRTM_CATASTRO_URL:http://localhost:8091}
    client-id: ${SRTM_CATASTRO_CLIENT_ID:}
    client-secret: ${SRTM_CATASTRO_CLIENT_SECRET:}
    # each request: catastro values a page of 500 predios on the fly
    timeout: ${SRTM_CATASTRO_TIMEOUT:60s}
    # the srtm organization (its slug or its id) whose catastro the single url and account are. empty: they are no
    # organization's and are not used
    organizacion: ${SRTM_CATASTRO_ORGANIZACION:}
    # #203: every `minutos` srtm reads each organization's GET /api/catastro/cambios (0: never) and, at or after
    # `hora` (America/Lima), starts at most one automatic corrida a day: on cambios, or weekly without them
    seguimiento:
      minutos: ${SRTM_CATASTRO_SEGUIMIENTO_MINUTOS:0}
      hora: ${SRTM_CATASTRO_SEGUIMIENTO_HORA:2}
  caja:
    # caja-backend's ordenes de cobro, a caja per organization of srtm, each written as its service account (rentas).
    # off until an entry is complete, and the secrets come from the environment, never here. organizaciones.<slug-or-id>:
    # url (caja's root), client-id, client-secret, timeout (default 10s) and, optional, organizacion (an id or a slug
    # with a dash or an underscore goes there, under any key). no entry is declared here: the environment adds them,
    # SRTM_CAJA_ORGANIZACIONES_<KEY>_URL, _CLIENT_ID, _CLIENT_SECRET, _TIMEOUT, _ORGANIZACION. an organization without
    # an entry behaves as before: no ordenes, no calls
    # how often the worker looks for the ordenes to send, how many it takes, and how many tries one gets before ERROR
    intervalo: ${SRTM_CAJA_INTERVALO:PT30S}
    lote: ${SRTM_CAJA_LOTE:50}
    intentos: ${SRTM_CAJA_INTENTOS:20}
    # how long a write of srtm waits for caja before leaving the orden to the worker
    plazo-en-linea: ${SRTM_CAJA_PLAZO_EN_LINEA:PT5S}
    # how long an orden caja did not answer waits before its next try, doubled on each one (up to an hour)
    espera-reintento: ${SRTM_CAJA_ESPERA_REINTENTO:PT30S}
  emision:
    # where the emisiones' files are kept (AlmacenEmision): local, on this server's disk under dir, or s3, in the
    # bucket of s3.* (no shared volume: what k8s wants)
    almacen: ${SRTM_EMISION_ALMACEN:local}
    # the local almacén's root: <dir>/emision-<id>/emision-<anio>-<id>.pdf|zip. a real deployment points it at a
    # persistent volume
    dir: ${SRTM_EMISION_DIR:./data/emisiones}
    # this instance's work files (a lote's .part and the .partes- of its pdf, the ensamblado- of an assembly) before
    # the almacén takes them. local to each instance and disposable: never a shared volume. what a worker that died
    # left here goes when the workers start again
    temporales: ${SRTM_EMISION_TEMPORALES:${java.io.tmpdir}/srtm-emision}
    # contribuyentes per lote: each lote is one parte, generated by one worker of any instance
    lote: ${SRTM_EMISION_LOTE:100}
    # this instance's workers: auto (one per core, as far as the memory goes at 300 MiB each over 512 MiB) or a
    # number; 0 runs none (the instance still takes POSTs). never more than the r2dbc pool's size - 2
    trabajadores: ${SRTM_EMISION_TRABAJADORES:auto}
    # how long a worker with nothing to do waits before looking again (a POST to this instance wakes them before)
    espera: ${SRTM_EMISION_ESPERA:5s}
    # a lote or an assembly whose instance stopped beating this long ago is taken over by another one
    lease: ${SRTM_EMISION_LEASE:2m}
    # takes of a lote before it is FALLIDO, its contribuyentes among the errores
    intentos: ${SRTM_EMISION_INTENTOS:3}
    # the retention, after every assembly and at startup: the last n files of each year are kept (per organization), and
    # none older than the days. 0 turns a rule off. a purged job keeps its record, without its file
    conservar: ${SRTM_EMISION_CONSERVAR:5}
    dias: ${SRTM_EMISION_DIAS:0}
    # the bucket of almacen=s3, required then. the credentials come from the aws sdk's default chain: the environment
    # (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY), the pod's web identity (irsa), a profile, the instance's role
    s3:
      bucket: ${SRTM_EMISION_S3_BUCKET:}
      # none: the sdk's chain (AWS_REGION); us-east-1 against another endpoint
      region: ${SRTM_EMISION_S3_REGION:}
      # another endpoint than aws' (minio), reached path-style; none: aws'
      endpoint: ${SRTM_EMISION_S3_ENDPOINT:}
      # the keys go under it: srtm/emisiones gives srtm/emisiones/emision-<id>/...; none: the bucket's root
      prefijo: ${SRTM_EMISION_S3_PREFIJO:}
