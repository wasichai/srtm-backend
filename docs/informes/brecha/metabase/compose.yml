# Metabase sobre el corte analítico (srtm-backend#206, task 9): una instancia por organización (plan, Decisión
# 2026-10-25: en Metabase OSS los usuarios de una instancia ven el nombre y el email de todos los demás, así que
# dos municipalidades nunca comparten una). Cada instancia es su propio proyecto de compose, metabase-<org>: su
# Metabase, su base de aplicación en Postgres (volumen propio) y, montada de solo lectura, solo la carpeta con
# el archivo DuckDB de su organización (el que arma `make duckdb ORG=<org>`). La imagen se construye una vez y
# la comparten todas (`image:` fijo). Plan § Rulings: acceso solo por túnel SSH (el puerto queda en 127.0.0.1
# del VPS, sin proxy en este carril); versiones fijas (Dockerfile) porque el driver solo declara compatible
# esta combinación.
#
#   make metabase-up ORG=<org>
#
# que corre (METABASE_ORG nombra el proyecto y la carpeta montada; el resto sale del archivo de la organización)
#
#   METABASE_ORG=<org> docker compose -p metabase-<org> -f metabase/compose.yml \
#     --env-file ~/.config/srtm-analitica/<org>.env up -d --build
#
# Con un Docker remoto, el puerto de cada organización queda en el loopback del servidor:
#   ssh -fN -L <puerto>:localhost:<puerto> <servidor>
#
# Las claves METABASE_* y MB_* del archivo de la organización salen de metabase.env.example. metabase/respaldo.sh
# y metabase/restaurar.sh operan sobre el metabase-postgres de una organización, la única base que guarda sus
# tableros, usuarios y colecciones - el archivo DuckDB se reconstruye solo con `make duckdb`.
name: metabase-${METABASE_ORG:?falta METABASE_ORG (usa make metabase-up ORG=<org>)}

services:
  metabase-postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_PG_PASSWORD:?falta METABASE_PG_PASSWORD en el archivo de la organización}
    # sin ports: solo el servicio metabase de este proyecto la alcanza, por la red interna del compose
    volumes:
      - metabase-pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metabase -d metabase']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  metabase:
    # una sola imagen para todas las organizaciones: la primera `up --build` la construye, las demás la reusan
    image: srtm-metabase:0.63.19-duckdb-1.5.5.0
    build:
      context: .
      args:
        METABASE_VERSION: '0.63.19'
    depends_on:
      metabase-postgres:
        condition: service_healthy
    ports:
      # solo loopback del servidor de Docker; el acceso real es por túnel SSH (plan § Rulings). Sin valor por
      # omisión: cada organización tiene el suyo, y dos con el mismo puerto no deben poder arrancar las dos
      - '127.0.0.1:${METABASE_PUERTO:?falta METABASE_PUERTO en el archivo de la organización}:3000'
    volumes:
      # solo la carpeta de esta organización (make duckdb ORG=<org> deja ahí <org>.duckdb), de solo lectura;
      # herramientas/base.py INIT_SQL además bloquea el acceso externo dentro de la conexión DuckDB
      - '/srv/srtm-metabase/${METABASE_ORG:?falta METABASE_ORG}/duckdb:/datos:ro'
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-postgres
      MB_DB_PORT: '5432'
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_PG_PASSWORD:?falta METABASE_PG_PASSWORD en el archivo de la organización}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?falta MB_ENCRYPTION_SECRET_KEY en <org>.env}
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:${METABASE_PUERTO}}
      MB_ANON_TRACKING_ENABLED: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
      MB_LOAD_SAMPLE_CONTENT: 'false'
      MB_REPORT_TIMEZONE: America/Lima
      # un techo, no lo que usa: en reposo cada instancia ronda los 600 MB (docs/develop/metabase-cortes.md)
      JAVA_TOOL_OPTIONS: -Xmx2g
    mem_limit: 3g
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      # Metabase tarda en arrancar (migra su base, carga el driver): sin esto el healthcheck lo marca
      # unhealthy antes de que termine y depends_on: service_healthy nunca lo vería sano
      start_period: 180s
    restart: unless-stopped

volumes:
  # uno por proyecto (metabase-<org>_metabase-pg-data): nunca compartido entre organizaciones
  metabase-pg-data:
