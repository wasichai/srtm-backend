# the libraries outside wasichai's bom. wasichai's own starters are versioned by wasichai-bom in build.gradle.kts
[versions]
# security floors for the build's own classpaths (the spring boot plugin's, ktlint's): they never reach the app jar
commons-lang3 = "3.20.0"
jackson3 = "3.2.3"
# ktlint 1.7.1 brings logback 1.3.15; lifted to the boot line
logback = "1.5.38"
# srtm.emision.almacen=s3: aws sdk v2, the bom aligns its modules
awssdk = "2.57.1"
# the maintained fork of openhtmltopdf, on pdfbox 3
openhtmltopdf = "1.1.97"
pdfbox = "3.0.8"
thymeleaf = "3.1.5.RELEASE"
# srtm.reportes: the xlsx export (Apache 2.0; its only dependency, opczip, Apache 2.0 too); its reader parses it in the tests
fastexcel = "0.20.2"

[libraries]
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
# the sdk's web identity provider (irsa) loads it by reflection: without it, every call of an eks pod fails
awssdk-sts = { module = "software.amazon.awssdk:sts" }
openhtmltopdf-pdfbox = { module = "io.github.openhtmltopdf:openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }
# its log through slf4j (spring's logging) instead of java.util.logging on stderr
openhtmltopdf-slf4j = { module = "io.github.openhtmltopdf:openhtmltopdf-slf4j", version.ref = "openhtmltopdf" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
thymeleaf = { module = "org.thymeleaf:thymeleaf", version.ref = "thymeleaf" }
fastexcel = { module = "org.dhatim:fastexcel", version.ref = "fastexcel" }
fastexcel-reader = { module = "org.dhatim:fastexcel-reader", version.ref = "fastexcel" }
# a minio for AlmacenS3's tests: versioned by testcontainers' bom (through spring boot's)
testcontainers-minio = { module = "org.testcontainers:testcontainers-minio" }
